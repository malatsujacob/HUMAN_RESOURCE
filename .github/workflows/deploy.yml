name: Deploy HUMAN_RESOURCE to EC2

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: /api
        run: |
          npm ci
          npm run build

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_pem
          chmod 600 ~/.ssh/id_pem
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Prepare EC2 directories
        run: |
          ssh -i ~/.ssh/id_pem "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" "mkdir -p ~/app/backend ~/app/frontend_dist"

      - name: Copy built frontend and backend files to EC2
        run: |
          scp -i ~/.ssh/id_pem -r frontend/dist/* "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:~/app/frontend_dist/"
          scp -i ~/.ssh/id_pem -r backend/app backend/migrations "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:~/app/backend/"
          scp -i ~/.ssh/id_pem backend/requirements.txt backend/deploy.sh "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:~/app/backend/"

      - name: Run remote deployment script on EC2
        run: |
          ssh -i ~/.ssh/id_pem "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" "chmod +x ~/app/backend/deploy.sh && bash ~/app/backend/deploy.sh"
